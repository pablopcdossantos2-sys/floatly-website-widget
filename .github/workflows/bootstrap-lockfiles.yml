name: Bootstrap dependency lockfiles
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b004a9e513613d286f06c426a2fda62016c6fe9e # pinned rust-toolchain action
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Generate and commit lockfiles only when missing
        shell: pwsh
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          if ((Test-Path package-lock.json) -and (Test-Path src-tauri/Cargo.lock)) {
            Write-Host "Both dependency lockfiles already exist; no changes are needed."
            exit 0
          }

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Could not generate package-lock.json." }

          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Could not generate Cargo.lock." }

          if (!(Test-Path package-lock.json) -or !(Test-Path src-tauri/Cargo.lock)) {
            throw "One or both lockfiles are missing after generation."
          }

          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No lockfile changes to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add reproducible npm and Cargo lockfiles"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the lockfile commit." }

          $tokenBytes = [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          $basic = [Convert]::ToBase64String($tokenBytes)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not push generated lockfiles to main." }
