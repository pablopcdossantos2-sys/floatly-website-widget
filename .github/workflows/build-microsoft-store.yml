name: Build Microsoft Store package
concurrency:
  group: widget-website-store-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-store:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned rust-toolchain action
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache Cargo registry only
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # actions/cache v6.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-store-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install locked npm dependencies
        run: npm ci
      - name: Check application and Store configuration
        shell: pwsh
        run: |
          npm run check:tauri-versions
          if ($LASTEXITCODE -ne 0) { throw "Tauri dependency versions are inconsistent." }
          npm run check:acl
          if ($LASTEXITCODE -ne 0) { throw "Tauri capability/command ACL check failed." }
          npm run check:store-config
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store configuration check failed." }
      - name: Check drag overlay behavior
        run: npm run check:drag-overlay
      - name: TypeScript type check
        run: npm run typecheck
      - name: Check light/dark theme contrast
        run: npm run check:contrast
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Install and run RustSec audit
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { throw "Could not install cargo-audit." }
          cargo audit --file src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "RustSec found an advisory affecting the locked dependencies." }
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build and sign the Microsoft Store installer
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-microsoft-store.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: widget-website-microsoft-store-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
