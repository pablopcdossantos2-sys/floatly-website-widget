name: Build Windows
concurrency:
  group: widget-website-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "icons/**"
      - "packaging/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - "index.html"
      - "settings.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/build-msix.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "icons/**"
      - "packaging/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - "index.html"
      - "settings.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/build-msix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned rust-toolchain action
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495 # v0.2
        with:
          version: v0.7.1

      - name: Cache Cargo registry only
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # actions/cache v6.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install locked npm dependencies
        run: npm ci
      - name: Check dependency versions and command ACL
        shell: pwsh
        run: |
          npm run check:tauri-versions
          if ($LASTEXITCODE -ne 0) { throw "Tauri dependency versions are inconsistent." }
          npm run check:acl
          if ($LASTEXITCODE -ne 0) { throw "Tauri capability/command ACL check failed." }
          npm run check:msix-config
          if ($LASTEXITCODE -ne 0) { throw "MSIX package configuration check failed." }
      - name: Check drag overlay fallback styling
        run: npm run check:drag-overlay
      - name: TypeScript type check
        run: npm run typecheck
      - name: Check light/dark theme contrast
        run: npm run check:contrast
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Generate Windows icons
        run: npm run icons
      - name: Build frontend before Rust tests
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Install and run RustSec audit
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { throw "Could not install cargo-audit." }
          cargo audit --file src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "RustSec found an advisory affecting the locked dependencies." }
      - name: Test configuration, diagnostics and window authorization
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Remove stale bundle outputs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue
          Remove-Item -Force "src-tauri/target/release/widget-website.exe" -ErrorAction SilentlyContinue
      - name: Compile unsigned Windows app and NSIS installer
        shell: pwsh
        run: |
          npm run tauri build -- -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed." }
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "Expected exactly one current NSIS installer; found $($installers.Count)." }
          if (!(Test-Path "src-tauri/target/release/widget-website.exe")) { throw "The application executable was not generated." }
          $exePath = "src-tauri/target/release/widget-website.exe"
          $peBytes = [System.IO.File]::ReadAllBytes($exePath)
          $peOffset = [BitConverter]::ToInt32($peBytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 90 -gt $peBytes.Length) { throw "Invalid PE header in application executable." }
          $optionalHeaderOffset = $peOffset + 24
          $peMagic = [BitConverter]::ToUInt16($peBytes, $optionalHeaderOffset)
          if ($peMagic -ne 0x20b -and $peMagic -ne 0x10b) { throw "Unknown PE optional header magic: $peMagic" }
          $subsystem = [BitConverter]::ToUInt16($peBytes, $optionalHeaderOffset + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), found subsystem $subsystem." }
          Write-Host "PE subsystem verified: Windows GUI (2)."
      - name: Validate unsigned MSIX packaging with isolated test identity
        shell: pwsh
        env:
          MSIX_PACKAGE_IDENTITY_NAME: FloatlyCiValidation
          MSIX_PACKAGE_PUBLISHER: CN=Floatly CI Validation
          MSIX_PUBLISHER_DISPLAY_NAME: Floatly CI Validation
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-msix.ps1
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging script failed." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem "dist/msix" -Filter "*.msix" -File)
          if ($packages.Count -ne 1) { throw "Expected one MSIX package, found $($packages.Count)." }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $manifestEntry = $archive.GetEntry("AppxManifest.xml")
            if ($null -eq $manifestEntry) { throw "MSIX archive has no AppxManifest.xml." }

            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }

            $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
            if ($null -eq $identity -or $identity.GetAttribute("Name") -ne "FloatlyCiValidation") {
              throw "MSIX manifest identity was not populated from the workflow inputs."
            }
            if ($identity.GetAttribute("Publisher") -ne "CN=Floatly CI Validation") {
              throw "MSIX manifest Publisher does not match the CI test input."
            }

            $exeEntry = $archive.Entries | Where-Object { $_.FullName -eq "widget-website.exe" } | Select-Object -First 1
            if ($null -eq $exeEntry) { throw "MSIX archive does not contain widget-website.exe." }

            $signatureEntry = $archive.GetEntry("AppxSignature.p7x")
            if ($null -ne $signatureEntry) { throw "Store submission artifact must be unsigned; found AppxSignature.p7x." }

            $startup = $manifest.SelectSingleNode("//*[local-name()='StartupTask' and @TaskId='FloatlyStartup']")
            if ($null -eq $startup) { throw "MSIX package is missing the FloatlyStartup task." }
          }
          finally {
            $archive.Dispose()
          }

          Get-FileHash $packages[0].FullName -Algorithm SHA256
          Remove-Item -Recurse -Force "dist/msix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: widget-website-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/widget-website.exe
          if-no-files-found: error
          retention-days: 14
  sign-and-publish:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: widget-website-build
          path: ${{ runner.temp }}/widget-website-build
      - name: Sign final artifacts without compiling dependencies
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "widget-website-build"
          $installerDir = Join-Path $root "bundle/nsis"
          $installers = @(Get-ChildItem $installerDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer to publish; found $($installers.Count)." }
          $appBinary = Join-Path $root "widget-website.exe"
          if (!(Test-Path $appBinary)) { throw "Application executable is missing from build artifact." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            Write-Warning "Publishing unsigned artifacts because signing secrets are not configured."
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP "widget-website-codesign.pfx"
          $existingThumbprints = @(Get-ChildItem Cert:\CurrentUser\My | ForEach-Object Thumbprint)
          try {
            $bytes = [Convert]::FromBase64String(($env:WINDOWS_PFX_BASE64 -replace '\s', ''))
            [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificates = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $certificate = $certificates | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $certificate) { throw "The PFX did not provide a certificate with a private key." }
            $thumbprint = $certificate.Thumbprint
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signtool = Get-ChildItem $sdkBin -Recurse -Filter "signtool.exe" -File -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "x64" } | Sort-Object { try { [version]$_.Directory.Parent.Name } catch { [version]"0.0" } } -Descending | Select-Object -First 1
            if ($null -eq $signtool) { throw "Windows SDK signtool.exe was not found." }
            foreach ($file in @($appBinary, $installers[0].FullName)) {
              & $signtool.FullName sign /s My /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "signtool could not sign $file." }
              & $signtool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "The Authenticode signature did not verify for $file." }
            }
            Write-Host "The application executable and installer were signed and verified."
          } finally {
            Get-ChildItem Cert:\CurrentUser\My | Where-Object { $existingThumbprints -notcontains $_.Thumbprint } | ForEach-Object {
              Remove-Item ("Cert:\CurrentUser\My\" + $_.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_PFX_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: widget-website-windows-x64
          path: |
            ${{ runner.temp }}/widget-website-build/bundle/nsis/*.exe
            ${{ runner.temp }}/widget-website-build/widget-website.exe
          if-no-files-found: error
          retention-days: 30
