name: Build Windows
concurrency:
  group: widget-website-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-cargo-
      - run: npm install
      - run: npm run icons
      - name: Test configuration and diagnostics
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compile Windows app and NSIS installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: widget-website-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/widget-website.exe
          if-no-files-found: error