name: Temporary Rust formatting
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b004a9e513613d286f06c426a2fda62016c6fe9e # pinned Rust toolchain
        with:
          toolchain: 1.90.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Format source files and commit only when changed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed." }
          git add src-tauri/src src-tauri/build.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Rust files already formatted."; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format Rust sources after audit fixes"
          if ($LASTEXITCODE -ne 0) { throw "Could not create formatting commit." }
          $tokenBytes = [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          $basic = [Convert]::ToBase64String($tokenBytes)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not push formatting commit to main." }
