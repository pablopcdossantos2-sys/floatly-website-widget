<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações — Widget Website</title><link rel="stylesheet" href="/src/styles.css"></head><body class="settings-page">
<header class="settings-header"><div class="app-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div><p class="eyebrow">WIDGET WEBSITE</p><h1>Configurações</h1><p class="muted">Personalize a janela do calendário.</p></div></header>
<form id="settings-form">
<section class="settings-section"><h2>Site</h2><label class="full">URL do site<input id="site_url" type="text" required></label><div class="two-col"><label>Largura (px)<input id="width" type="number" min="150" max="2000" required></label><label>Altura (px)<input id="height" type="number" min="100" max="1600" required></label></div></section>
<section class="settings-section"><h2>Janela</h2>
<label class="check-row"><input id="remember_position" type="checkbox"><span><strong>Lembrar posição e tamanho</strong><small>Reposiciona a janela se o monitor salvo não estiver conectado.</small></span></label>
<label class="check-row"><input id="always_on_top" type="checkbox"><span><strong>Sempre no topo</strong><small>Mantém o widget acima de outras janelas.</small></span></label>
<label class="check-row"><input id="show_in_taskbar" type="checkbox"><span><strong>Mostrar na barra de tarefas</strong><small>Se desativado, use o ícone da bandeja para reabrir.</small></span></label>
<label class="check-row"><input id="locked" type="checkbox"><span><strong>Travar mover e redimensionar</strong><small>Desativa a alça e as bordas de redimensionamento.</small></span></label>
<label class="check-row"><input id="autostart" type="checkbox"><span><strong>Iniciar com o Windows</strong><small>Usa o registro do usuário atual, sem exigir administrador.</small></span></label></section>
<section class="settings-section"><h2>Aparência e atualização</h2><label class="range-label">Opacidade <output id="opacity-value">100%</output><input id="opacity" type="range" min="30" max="100" step="5"></label><label class="range-label">Zoom do navegador embutido <output id="zoom-value">100%</output><input id="zoom" type="range" min="50" max="200" step="5"><small>Controla a ampliação do próprio WebView2, entre 50% e 200%, sem depender do CSS do site.</small></label><div class="two-col"><label>Raio dos cantos (px)<input id="corner_radius" type="number" min="0" max="64"></label><label>Recarregar a cada (min)<input id="auto_reload_minutes" type="number" min="0" max="1440"><small>0 desliga; valores ativos abaixo de 5 são ajustados para 5.</small></label></div></section>
<section class="settings-section"><h2>Atalho global</h2><label class="full">Combinação de teclas<input id="global_shortcut" type="text" readonly autocomplete="off" spellcheck="false"></label><p class="muted">Clique no campo e pressione a combinação desejada (ex.: Ctrl + Alt + C).</p></section>
<div id="message" class="message" role="status" aria-live="polite"></div><footer class="settings-actions"><button type="button" id="reset" class="secondary">Restaurar tamanho padrão</button><span class="actions-right"><button type="button" id="close" class="secondary">Fechar</button><button type="submit" class="primary">Salvar alterações</button></span></footer>
</form><script type="module" src="/src/settings.ts"></script></body></html>
