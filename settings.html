<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configurações — Floatly</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body class="settings-page">
<header class="settings-header">
  <div class="settings-heading">
    <div class="app-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div>
      <p class="eyebrow">FLOATLY</p>
      <h1 data-i18n="pageTitle">Configurações</h1>
      <p class="muted" data-i18n="subtitle">Personalize a janela do site escolhido.</p>
    </div>
  </div>
  <div class="theme-switch" role="group" data-i18n-aria-label="themeGroup" aria-label="Tema da interface">
    <button type="button" id="theme-light" class="theme-option" aria-pressed="true" data-i18n="themeLight">Modo claro</button>
    <button type="button" id="theme-dark" class="theme-option" aria-pressed="false" data-i18n="themeDark">Modo escuro</button>
  </div>
</header>
<form id="settings-form">
  <section class="settings-section">
    <h2 data-i18n="languageSection">Idioma</h2>
    <label class="full"><span data-i18n="languageLabel">Idioma do programa</span>
      <select id="language">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <small data-i18n="languageHelp">Altera o idioma das configurações e dos menus do Floatly.</small>
    </label>
  </section>
  <section class="settings-section">
    <h2 data-i18n="siteSection">Site</h2>
    <label class="full"><span data-i18n="siteUrl">URL do site</span><input id="site_url" type="text" placeholder="https://example.com" required></label>
    <div class="two-col">
      <label><span data-i18n="width">Largura (px)</span><input id="width" type="number" min="150" max="2000" step="1" required></label>
      <label><span data-i18n="height">Altura (px)</span><input id="height" type="number" min="100" max="1600" step="1" required></label>
    </div>
  </section>
  <section class="settings-section">
    <h2 data-i18n="windowSection">Janela</h2>
    <label class="check-row"><input id="remember_position" type="checkbox"><span><strong data-i18n="rememberPosition">Lembrar posição e tamanho</strong><small data-i18n="rememberPositionHelp">Reposiciona a janela se o monitor salvo não estiver conectado.</small></span></label>
    <label class="check-row"><input id="always_on_top" type="checkbox"><span><strong data-i18n="alwaysOnTop">Sempre no topo</strong><small data-i18n="alwaysOnTopHelp">Mantém o widget acima de outras janelas.</small></span></label>
    <label class="check-row"><input id="show_in_taskbar" type="checkbox"><span><strong data-i18n="taskbar">Mostrar na barra de tarefas</strong><small data-i18n="taskbarHelp">Se desativado, use o ícone da bandeja para reabrir.</small></span></label>
    <label class="check-row"><input id="locked" type="checkbox"><span><strong data-i18n="locked">Travar mover e redimensionar</strong><small data-i18n="lockedHelp">Ative para bloquear o movimento e o redimensionamento. Desative para habilitar o arraste pela borda azul ao redor do widget.</small></span></label>
    <label class="check-row"><input id="autostart" type="checkbox"><span><strong data-i18n="autostart">Iniciar com o Windows</strong><small data-i18n="autostartHelp">Usa o registro do usuário atual, sem exigir administrador.</small></span></label>
  </section>
  <section class="settings-section">
    <h2 data-i18n="appearanceSection">Aparência e atualização</h2>
    <label class="range-label"><span data-i18n="zoom">Zoom do navegador embutido</span> <output id="zoom-value">80%</output><input id="zoom" type="range" min="50" max="200" step="5"><small data-i18n="zoomHelp">Ampliação do WebView2 entre 50% e 200%, independente do CSS do site.</small></label>
    <div class="two-col">
      <label><span data-i18n="cornerRadius">Raio dos cantos (px)</span><input id="corner_radius" type="number" min="0" max="64" step="1" required></label>
      <label><span data-i18n="reload">Recarregar a cada (min)</span><input id="auto_reload_minutes" type="number" min="0" max="1440" step="1" required><small data-i18n="reloadHelp">0 desliga; valores ativos abaixo de 5 são ajustados para 5.</small></label>
    </div>
  </section>
  <section class="settings-section">
    <h2 data-i18n="shortcutSection">Atalho global</h2>
    <label class="full"><span data-i18n="shortcutCombination">Combinação de teclas</span><input id="global_shortcut" type="text" readonly autocomplete="off" spellcheck="false"></label>
    <p class="muted" data-i18n="shortcutHelp">Esse atalho mostra ou oculta o widget mesmo quando você está usando outro programa. Clique no campo e pressione a combinação desejada (ex.: Ctrl + Alt + C).</p>
    <button type="button" id="reset-shortcut" class="secondary shortcut-reset" data-i18n="shortcutReset">Restaurar atalho padrão</button>
  </section>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <footer class="settings-actions">
    <button type="button" id="reset" class="secondary" data-i18n="reset">Restaurar tamanho padrão</button>
    <span class="actions-right"><button type="button" id="close" class="secondary" data-i18n="close">Fechar</button><button type="submit" class="primary" data-i18n="save">Salvar alterações</button></span>
  </footer>
</form>
<script type="module" src="/src/settings.ts"></script>
</body>
</html>
